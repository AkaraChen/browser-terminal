<!doctype html>
<html lang="zh-CN" class="bg-[#111318]">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Browser Terminal</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css"
        />
        <link id="app-icon" rel="icon" href="data:," />
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body
        class="grid h-screen grid-rows-[44px_1fr] overflow-hidden bg-[#111318] text-zinc-100"
    >
        <header class="flex items-center justify-between gap-4 px-3">
            <div
                x-data="connectionStatus"
                class="flex items-center gap-2.5 text-sm text-zinc-400"
            >
                <span
                    class="h-2 w-2 shrink-0 rounded-full"
                    :class="statusClass"
                    aria-hidden="true"
                ></span>
                <span x-text="label">connecting</span>
            </div>
            <div
                x-data="terminalToolbar"
                class="flex shrink-0 items-center gap-2"
            >
                <button
                    type="button"
                    aria-label="设置"
                    @click="openSettings"
                    class="grid size-[30px] place-items-center rounded-md border border-zinc-700 bg-zinc-800 hover:border-emerald-500"
                >
                    <i
                        data-lucide="settings"
                        class="h-4 w-4"
                        aria-hidden="true"
                    ></i>
                </button>
                <button
                    type="button"
                    aria-label="新建窗口"
                    title="新建窗口"
                    @click="openNewTab"
                    class="grid size-[30px] place-items-center rounded-md border border-zinc-700 bg-zinc-800 hover:border-emerald-500"
                >
                    <i
                        data-lucide="plus"
                        class="h-4 w-4"
                        aria-hidden="true"
                    ></i>
                </button>
            </div>
        </header>
        <main x-data="terminalPane" class="min-h-0 px-3 pb-3">
            <div x-ref="terminal" class="h-full min-h-0"></div>
        </main>

        <dialog
            x-data="settingsDialog"
            x-ref="dialog"
            @settings-open.window="open"
            class="w-[min(92vw,380px)] rounded-lg border border-zinc-700 bg-zinc-900 p-0 text-zinc-100 shadow-2xl backdrop:bg-black/60"
        >
            <form
                method="dialog"
                class="flex items-center justify-between border-b border-zinc-700 px-4 py-3"
            >
                <h2 class="text-sm font-medium">设置</h2>
                <button
                    type="submit"
                    aria-label="关闭"
                    class="grid size-8 place-items-center rounded-md text-zinc-300 hover:bg-zinc-800"
                >
                    <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
                </button>
            </form>
            <div class="grid gap-4 p-4">
                <label class="grid gap-2 text-sm text-zinc-300">
                    <span>字体</span>
                    <select
                        x-model="$store.terminal.settings.fontFamily"
                        @change="updateFontFamily($event.target.value)"
                        class="h-9 rounded-md border border-zinc-700 bg-zinc-950 px-3 text-zinc-100 outline-none focus:border-emerald-500"
                    >
                        <option value="JetBrainsMono Nerd Font">
                            JetBrainsMono Nerd Font
                        </option>
                        <option value="MesloLGM Nerd Font">
                            MesloLGM Nerd Font
                        </option>
                        <option
                            value='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace'
                        >
                            系统等宽
                        </option>
                    </select>
                </label>
                <label class="grid gap-2 text-sm text-zinc-300">
                    <span>字体大小</span>
                    <div class="grid grid-cols-[1fr_76px] gap-3">
                        <input
                            type="range"
                            min="10"
                            max="28"
                            step="1"
                            x-model.number="$store.terminal.settings.fontSize"
                            @input="updateFontSize($event.target.value)"
                            class="w-full accent-emerald-500"
                        />
                        <input
                            type="number"
                            min="10"
                            max="28"
                            step="1"
                            x-model="$store.terminal.fontSizeInput"
                            @focus="$event.target.select()"
                            @input="updateFontSizeInput($event.target.value)"
                            @change="syncSettingsForm"
                            class="h-9 rounded-md border border-zinc-700 bg-zinc-950 px-2 text-zinc-100 outline-none focus:border-emerald-500"
                        />
                    </div>
                </label>
            </div>
        </dialog>

        <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit/lib/addon-fit.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-fonts@0.1.0/lib/addon-web-fonts.js"></script>
        <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
        <script type="module" src="/app.js"></script>
    </body>
</html>
