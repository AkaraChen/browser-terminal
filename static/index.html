<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="grid h-screen grid-rows-[44px_1fr] overflow-hidden bg-zinc-950 text-zinc-100">
    <header class="flex items-center justify-between gap-4 border-b border-zinc-700 bg-zinc-900 px-3">
      <div class="flex min-w-0 items-center gap-2.5 text-sm text-zinc-400" title="Channel">
        <span id="status-dot" class="h-2 w-2 shrink-0 rounded-full bg-zinc-500" aria-hidden="true"></span>
        <span id="channel" class="truncate"></span>
      </div>
      <div class="flex shrink-0 items-center gap-2">
        <button
          id="settings-button"
          type="button"
          aria-label="设置"
          class="grid size-[30px] place-items-center rounded-md border border-zinc-700 bg-zinc-800 hover:border-emerald-500"
        >
          <i data-lucide="settings" class="h-4 w-4" aria-hidden="true"></i>
        </button>
        <button
          id="new-tab"
          type="button"
          aria-label="新建 tab"
          title="新建 tab"
          class="grid size-[30px] place-items-center rounded-md border border-zinc-700 bg-zinc-800 hover:border-emerald-500"
        >
          <i data-lucide="plus" class="h-4 w-4" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    <main id="terminal" class="min-h-0"></main>

    <dialog
      id="settings-dialog"
      class="w-[min(92vw,380px)] rounded-lg border border-zinc-700 bg-zinc-900 p-0 text-zinc-100 shadow-2xl backdrop:bg-black/60"
    >
      <form method="dialog" class="flex items-center justify-between border-b border-zinc-700 px-4 py-3">
        <h2 class="text-sm font-medium">设置</h2>
        <button
          type="submit"
          aria-label="关闭"
          class="grid size-8 place-items-center rounded-md text-zinc-300 hover:bg-zinc-800"
        >
          <i data-lucide="x" class="h-4 w-4" aria-hidden="true"></i>
        </button>
      </form>
      <div class="grid gap-4 p-4">
        <label class="grid gap-2 text-sm text-zinc-300">
          <span>字体</span>
          <select
            id="font-family"
            class="h-9 rounded-md border border-zinc-700 bg-zinc-950 px-3 text-zinc-100 outline-none focus:border-emerald-500"
          >
            <option value='ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace'>
              系统等宽
            </option>
            <option value='Menlo, Monaco, Consolas, "Liberation Mono", monospace'>Menlo</option>
            <option value='"JetBrains Mono", Menlo, Monaco, Consolas, monospace'>JetBrains Mono</option>
            <option value='"Fira Code", Menlo, Monaco, Consolas, monospace'>Fira Code</option>
            <option value='Consolas, "Liberation Mono", monospace'>Consolas</option>
          </select>
        </label>
        <label class="grid gap-2 text-sm text-zinc-300">
          <span>字体大小</span>
          <div class="grid grid-cols-[1fr_76px] gap-3">
            <input id="font-size-range" type="range" min="10" max="28" step="1" class="w-full accent-emerald-500" />
            <input
              id="font-size"
              type="number"
              min="10"
              max="28"
              step="1"
              class="h-9 rounded-md border border-zinc-700 bg-zinc-950 px-2 text-zinc-100 outline-none focus:border-emerald-500"
            />
          </div>
        </label>
      </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      const SETTINGS_KEY = "browser-terminal:settings";
      const DEFAULT_SETTINGS = {
        fontFamily:
          'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace',
        fontSize: 14,
      };
      const params = new URLSearchParams(window.location.search);
      let channelId = params.get("channel") || params.get("channel_id");

      if (!channelId) {
        channelId = crypto.randomUUID();
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("channel", channelId);
        window.history.replaceState(null, "", nextUrl);
      }

      const channelLabel = document.getElementById("channel");
      const statusDot = document.getElementById("status-dot");
      const settingsButton = document.getElementById("settings-button");
      const settingsDialog = document.getElementById("settings-dialog");
      const fontFamilyInput = document.getElementById("font-family");
      const fontSizeInput = document.getElementById("font-size");
      const fontSizeRange = document.getElementById("font-size-range");
      const newTabButton = document.getElementById("new-tab");
      const terminalElement = document.getElementById("terminal");

      channelLabel.textContent = channelId;
      window.lucide?.createIcons();
      let settings = readSettings();

      const term = new Terminal({
        cursorBlink: true,
        convertEol: true,
        fontFamily: settings.fontFamily,
        fontSize: settings.fontSize,
        lineHeight: 1.1,
        scrollback: 5000,
        theme: {
          background: "#111318",
          foreground: "#e9edf3",
          cursor: "#e9edf3",
          selectionBackground: "#3f5268",
          black: "#111318",
          red: "#e06c75",
          green: "#98c379",
          yellow: "#e5c07b",
          blue: "#61afef",
          magenta: "#c678dd",
          cyan: "#56b6c2",
          white: "#d7dae0",
          brightBlack: "#5c6370",
          brightRed: "#e06c75",
          brightGreen: "#98c379",
          brightYellow: "#e5c07b",
          brightBlue: "#61afef",
          brightMagenta: "#c678dd",
          brightCyan: "#56b6c2",
          brightWhite: "#ffffff",
        },
      });
      const fitAddon = new FitAddon.FitAddon();
      const encoder = new TextEncoder();

      term.loadAddon(fitAddon);
      term.open(terminalElement);
      term.element?.classList.add("h-full");
      fitAddon.fit();
      term.focus();
      syncSettingsForm(settings);

      const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(
        `${wsProtocol}//${window.location.host}/ws/${encodeURIComponent(channelId)}`,
      );
      socket.binaryType = "arraybuffer";

      function setStatus(state) {
        statusDot.className =
          "h-2 w-2 shrink-0 rounded-full " +
          (state === "connected"
            ? "bg-emerald-400"
            : state === "disconnected"
              ? "bg-red-400"
              : "bg-zinc-500");
      }

      function sendResize() {
        if (socket.readyState !== WebSocket.OPEN) return;
        socket.send(
          JSON.stringify({
            type: "resize",
            cols: term.cols,
            rows: term.rows,
          }),
        );
      }

      function readSettings() {
        try {
          const raw = localStorage.getItem(SETTINGS_KEY);
          if (!raw) return { ...DEFAULT_SETTINGS };

          const parsed = JSON.parse(raw);
          return normalizeSettings(parsed);
        } catch {
          return { ...DEFAULT_SETTINGS };
        }
      }

      function normalizeSettings(value) {
        const fontFamily =
          typeof value?.fontFamily === "string" && value.fontFamily.trim()
            ? value.fontFamily
            : DEFAULT_SETTINGS.fontFamily;
        const fontSize = Number.parseInt(value?.fontSize, 10);

        return {
          fontFamily,
          fontSize: Number.isFinite(fontSize) ? Math.min(28, Math.max(10, fontSize)) : DEFAULT_SETTINGS.fontSize,
        };
      }

      function saveSettings(nextSettings, options = {}) {
        settings = normalizeSettings(nextSettings);
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        applySettings(settings);
        if (options.syncForm !== false) {
          syncSettingsForm(settings);
        }
      }

      function applySettings(nextSettings) {
        term.options.fontFamily = nextSettings.fontFamily;
        term.options.fontSize = nextSettings.fontSize;
        fitAddon.fit();
        sendResize();
      }

      function syncSettingsForm(nextSettings) {
        fontFamilyInput.value = nextSettings.fontFamily;
        fontSizeInput.value = nextSettings.fontSize;
        fontSizeRange.value = nextSettings.fontSize;
      }

      socket.addEventListener("open", () => {
        setStatus("connected");
        sendResize();
        term.focus();
      });

      socket.addEventListener("message", (event) => {
        if (event.data instanceof ArrayBuffer) {
          term.write(new Uint8Array(event.data));
          return;
        }

        if (event.data instanceof Blob) {
          event.data.arrayBuffer().then((buffer) => term.write(new Uint8Array(buffer)));
          return;
        }

        term.write(event.data);
      });

      socket.addEventListener("close", () => {
        setStatus("disconnected");
        term.writeln("");
        term.writeln("[disconnected]");
      });

      socket.addEventListener("error", () => {
        setStatus("disconnected");
      });

      term.onData((data) => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(encoder.encode(data));
        }
      });

      term.onResize(sendResize);

      const resizeObserver = new ResizeObserver(() => {
        fitAddon.fit();
        sendResize();
      });
      resizeObserver.observe(terminalElement);

      settingsButton.addEventListener("click", () => {
        syncSettingsForm(settings);
        settingsDialog.showModal();
      });

      fontFamilyInput.addEventListener("change", () => {
        saveSettings({ ...settings, fontFamily: fontFamilyInput.value });
      });

      fontSizeInput.addEventListener("focus", () => {
        fontSizeInput.select();
      });

      fontSizeInput.addEventListener("input", () => {
        if (!fontSizeInput.value) return;

        saveSettings({ ...settings, fontSize: fontSizeInput.value }, { syncForm: false });
        fontSizeRange.value = settings.fontSize;
      });

      fontSizeInput.addEventListener("change", () => {
        syncSettingsForm(settings);
      });

      fontSizeRange.addEventListener("input", () => {
        saveSettings({ ...settings, fontSize: fontSizeRange.value });
      });

      window.addEventListener("storage", (event) => {
        if (event.key !== SETTINGS_KEY) return;

        settings = readSettings();
        applySettings(settings);
        syncSettingsForm(settings);
      });

      newTabButton.addEventListener("click", () => {
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("channel", crypto.randomUUID());
        window.open(nextUrl.toString(), "_blank", "noopener");
      });
    </script>
  </body>
</html>
